<script>
  (function() {
    'use strict';

    var state = {
      schema: null,
      components: [],
      componentMap: {},
      settings: {},
      settingsComplete: false,
      currentSection: 0,
      toastTimer: null
    };

    document.addEventListener('DOMContentLoaded', function() {
      bindStaticEvents_();
      loadApplication_();
    });

    function bindStaticEvents_() {
      document.querySelectorAll('.step-tab').forEach(function(button) {
        button.addEventListener('click', function() {
          showSection_(Number(button.dataset.section));
        });
      });

      document.getElementById('previous-button').addEventListener('click', function() {
        showSection_(state.currentSection - 1);
      });
      document.getElementById('next-button').addEventListener('click', function() {
        showSection_(state.currentSection + 1);
      });
      document.getElementById('add-component-button').addEventListener('click', function() {
        addComponentRow_('');
      });
      document.getElementById('case-form').addEventListener('submit', submitForm_);

      document.getElementById('settings-button').addEventListener('click', openSettings_);
      document.getElementById('warning-settings-button').addEventListener('click', openSettings_);
      document.getElementById('close-settings-button').addEventListener('click', closeSettings_);
      document.getElementById('cancel-settings-button').addEventListener('click', closeSettings_);
      document.getElementById('save-settings-button').addEventListener('click', saveSettings_);
      document.getElementById('create-another-button').addEventListener('click', resetForAnotherCase_);

      document.getElementById('settings-modal').addEventListener('click', function(event) {
        if (event.target.id === 'settings-modal') {
          closeSettings_();
        }
      });
    }

    function loadApplication_() {
      setBusy_(true, 'Cargando formulario…');
      callServer_('getBootstrapData')
        .then(function(data) {
          state.schema = data.schema;
          state.components = data.components;
          state.componentMap = data.components.reduce(function(map, component) {
            map[component.code] = component;
            return map;
          }, {});
          state.settings = data.settings || {};
          state.settingsComplete = Boolean(data.settingsComplete);

          document.getElementById('app-name').textContent = data.appName || 'Case Form';
          renderSectionA_();
          renderSectionD_();
          addComponentRow_('');
          applySchemaText_();
          populateSettings_();
          updateSettingsWarning_();
          showSection_(0);

        })
        .catch(function(error) {
          showToast_(getErrorMessage_(error), 'error', 9000);
        })
        .finally(function() {
          setBusy_(false);
        });
    }

    function applySchemaText_() {
      ['A', 'B', 'C', 'D'].forEach(function(letter) {
        var section = state.schema['section' + letter];
        document.getElementById('section-' + letter.toLowerCase() + '-title').textContent = section.title;
        document.getElementById('section-' + letter.toLowerCase() + '-description').textContent = section.description;
      });
    }

    function renderSectionA_() {
      var container = document.getElementById('section-a-fields');
      container.replaceChildren();

      state.schema.sectionA.fields.forEach(function(field) {
        var group = createElement_('div', 'field-group');
        if (field.type === 'textarea') {
          group.classList.add('full-width');
        }

        var label = createElement_('label', 'field-label', field.label);
        label.htmlFor = 'field-' + field.id;
        if (field.required) {
          var mark = createElement_('span', 'required-mark', ' *');
          label.appendChild(mark);
        }

        var control;
        if (field.type === 'textarea') {
          control = createElement_('textarea', 'textarea-input');
        } else if (field.type === 'select') {
          control = createElement_('select', 'select-input');
          var placeholder = createElement_('option', '', 'Seleccione una opción');
          placeholder.value = '';
          control.appendChild(placeholder);
          field.options.forEach(function(optionValue) {
            var option = createElement_('option', '', optionValue);
            option.value = optionValue;
            control.appendChild(option);
          });
        } else {
          control = createElement_('input', 'text-input');
          control.type = 'text';
        }

        control.id = 'field-' + field.id;
        control.dataset.fieldId = field.id;
        control.dataset.section = '0';
        control.placeholder = field.placeholder || '';
        control.addEventListener('input', function() { clearInputError_(control); });
        control.addEventListener('change', function() { clearInputError_(control); });

        group.appendChild(label);
        group.appendChild(control);
        container.appendChild(group);
      });
    }

    function renderSectionD_() {
      var body = document.getElementById('section-d-fields');
      body.replaceChildren();

      state.schema.sectionD.fields.forEach(function(field) {
        var row = document.createElement('tr');
        row.dataset.fieldId = field.id;
        row.appendChild(createElement_('td', '', field.label));
        row.appendChild(createElement_('td', '', field.unit));

        ['min', 'target', 'max'].forEach(function(kind) {
          var cell = document.createElement('td');
          var input = createElement_('input', 'number-input');
          input.type = 'number';
          input.step = 'any';
          input.inputMode = 'decimal';
          input.dataset.kind = kind;
          input.dataset.fieldId = field.id;
          input.dataset.section = '3';
          input.setAttribute('aria-label', field.label + ' ' + kind);
          input.addEventListener('input', function() { clearInputError_(input); });
          cell.appendChild(input);
          row.appendChild(cell);
        });
        body.appendChild(row);
      });
    }

    function addComponentRow_(selectedCode) {
      var rows = document.querySelectorAll('.component-row');
      if (rows.length >= state.components.length) {
        showToast_('Ya se agregaron todos los componentes disponibles.', 'error');
        return;
      }

      var row = createElement_('div', 'component-row');
      var select = createElement_('select', 'select-input component-code');
      var emptyOption = createElement_('option', '', 'Seleccione un código');
      emptyOption.value = '';
      select.appendChild(emptyOption);
      state.components.forEach(function(component) {
        var option = createElement_('option', '', component.code);
        option.value = component.code;
        select.appendChild(option);
      });
      select.value = selectedCode || '';

      var name = createElement_('input', 'text-input readonly-input component-name');
      name.type = 'text';
      name.readOnly = true;
      name.tabIndex = -1;
      name.placeholder = 'Se completa automáticamente';

      var percentage = createElement_('input', 'number-input component-percentage');
      percentage.type = 'number';
      percentage.min = '0';
      percentage.max = '100';
      percentage.step = 'any';
      percentage.inputMode = 'decimal';
      percentage.placeholder = '0';
      percentage.setAttribute('aria-label', 'Porcentaje del componente');

      var remove = createElement_('button', 'remove-component', '×');
      remove.type = 'button';
      remove.title = 'Eliminar componente';
      remove.setAttribute('aria-label', 'Eliminar componente');

      select.addEventListener('change', function() {
        updateComponentRow_(row);
        refreshComponentOptions_();
        renderSectionC_();
      });
      percentage.addEventListener('input', function() {
        clearInputError_(percentage);
        updatePercentageTotal_();
        renderSectionC_();
      });
      remove.addEventListener('click', function() {
        row.remove();
        if (!document.querySelector('.component-row')) {
          addComponentRow_('');
        }
        refreshComponentOptions_();
        updatePercentageTotal_();
        renderSectionC_();
      });

      row.appendChild(select);
      row.appendChild(name);
      row.appendChild(percentage);
      row.appendChild(remove);
      document.getElementById('component-rows').appendChild(row);

      updateComponentRow_(row);
      refreshComponentOptions_();
      updatePercentageTotal_();
      renderSectionC_();
    }

    function updateComponentRow_(row) {
      var code = row.querySelector('.component-code').value;
      var component = state.componentMap[code];
      row.querySelector('.component-name').value = component ? component.name : '';
      clearInputError_(row.querySelector('.component-code'));
    }

    function refreshComponentOptions_() {
      var selects = Array.from(document.querySelectorAll('.component-code'));
      var selected = selects.map(function(select) { return select.value; }).filter(Boolean);

      selects.forEach(function(select) {
        Array.from(select.options).forEach(function(option) {
          option.disabled = Boolean(option.value && option.value !== select.value && selected.indexOf(option.value) !== -1);
        });
      });
      document.getElementById('add-component-button').disabled = selects.length >= state.components.length;
    }

    function getSelectedComponents_() {
      return Array.from(document.querySelectorAll('.component-row')).map(function(row) {
        var code = row.querySelector('.component-code').value;
        var component = state.componentMap[code];
        return {
          row: row,
          code: code,
          name: component ? component.name : '',
          percentageText: row.querySelector('.component-percentage').value,
          percentage: Number(row.querySelector('.component-percentage').value),
          component: component || null
        };
      });
    }

    function updatePercentageTotal_() {
      var total = getSelectedComponents_().reduce(function(sum, item) {
        return sum + (Number.isFinite(item.percentage) ? item.percentage : 0);
      }, 0);
      var rounded = Math.round(total * 10000) / 10000;
      var summary = document.querySelector('.percentage-summary');
      var bar = document.getElementById('percentage-bar');

      document.getElementById('percentage-total').textContent = rounded + '%';
      bar.style.width = Math.min(Math.max(total, 0), 100) + '%';
      summary.classList.toggle('valid', Math.abs(total - 100) <= 0.01);
      summary.classList.toggle('invalid-over', total > 100.01);
      document.getElementById('percentage-message').textContent = Math.abs(total - 100) <= 0.01
        ? 'La composición está completa.'
        : total > 100
          ? 'La suma excede 100%. Ajuste los porcentajes.'
          : 'Falta ' + (Math.round((100 - total) * 10000) / 10000) + '% para completar la composición.';
    }

    function renderSectionC_() {
      if (!state.schema) return;
      var selected = getSelectedComponents_().filter(function(item) { return item.component; });
      var empty = document.getElementById('section-c-empty');
      var tableContainer = document.getElementById('characteristic-table-container');
      var tableHead = document.getElementById('characteristic-table-head');
      var tableBody = document.getElementById('characteristic-table-body');

      tableHead.replaceChildren();
      tableBody.replaceChildren();
      empty.classList.toggle('hidden', selected.length > 0);
      tableContainer.classList.toggle('hidden', selected.length === 0);

      if (!selected.length) return;

      var headerRow = document.createElement('tr');
      ['Código', 'Nombre', 'Porcentaje'].forEach(function(label) {
        var header = createElement_('th', '', label);
        header.scope = 'col';
        headerRow.appendChild(header);
      });

      state.schema.sectionC.characteristics.forEach(function(characteristic) {
        var label = characteristic.label;
        if (characteristic.unit && characteristic.unit !== '-') {
          label += ' (' + characteristic.unit + ')';
        }
        var header = createElement_('th', '', label);
        header.scope = 'col';
        header.title = label;
        headerRow.appendChild(header);
      });
      tableHead.appendChild(headerRow);

      selected.forEach(function(item) {
        var row = document.createElement('tr');

        var codeCell = document.createElement('td');
        codeCell.appendChild(createElement_('span', 'component-code-chip', item.code));
        row.appendChild(codeCell);

        var nameCell = createElement_('td', 'component-name-cell', item.name);
        nameCell.title = item.name;
        row.appendChild(nameCell);

        row.appendChild(createElement_(
          'td',
          'component-percentage-cell',
          Number.isFinite(item.percentage) ? item.percentage + '%' : '—'
        ));

        state.schema.sectionC.characteristics.forEach(function(characteristic) {
          var value = item.component.characteristics[characteristic.id];
          var displayedValue = value == null || value === '' ? '—' : String(value);
          var cell = createElement_('td', 'characteristic-value-cell', displayedValue);
          cell.title = displayedValue;
          row.appendChild(cell);
        });
        tableBody.appendChild(row);
      });
    }

    function showSection_(index) {
      state.currentSection = Math.max(0, Math.min(3, index));
      document.querySelectorAll('.step-tab').forEach(function(tab) {
        tab.classList.toggle('active', Number(tab.dataset.section) === state.currentSection);
      });
      document.querySelectorAll('.form-panel').forEach(function(panel) {
        panel.classList.toggle('active', Number(panel.dataset.panel) === state.currentSection);
      });

      document.getElementById('previous-button').classList.toggle('hidden', state.currentSection === 0);
      document.getElementById('next-button').classList.toggle('hidden', state.currentSection === 3);
      document.getElementById('submit-button').classList.toggle('hidden', state.currentSection !== 3);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function collectPayload_() {
      var sectionA = {};
      state.schema.sectionA.fields.forEach(function(field) {
        sectionA[field.id] = document.getElementById('field-' + field.id).value.trim();
      });

      var sectionD = {};
      state.schema.sectionD.fields.forEach(function(field) {
        var row = document.querySelector('#section-d-fields tr[data-field-id="' + field.id + '"]');
        sectionD[field.id] = {
          min: row.querySelector('[data-kind="min"]').value,
          target: row.querySelector('[data-kind="target"]').value,
          max: row.querySelector('[data-kind="max"]').value
        };
      });

      return {
        caseName: document.getElementById('case-name').value.trim(),
        sectionA: sectionA,
        components: getSelectedComponents_().map(function(item) {
          return { code: item.code, percentage: item.percentageText };
        }),
        sectionD: sectionD
      };
    }

    function validateClient_() {
      clearAllErrors_();

      if (!state.settingsComplete) {
        openSettings_();
        showToast_('Configure la carpeta destino y la plantilla.', 'error');
        return false;
      }

      var caseName = document.getElementById('case-name');
      if (!caseName.value.trim()) {
        markInvalid_(caseName, 'Escriba el nombre del caso.');
        return false;
      }

      for (var aIndex = 0; aIndex < state.schema.sectionA.fields.length; aIndex += 1) {
        var field = state.schema.sectionA.fields[aIndex];
        var control = document.getElementById('field-' + field.id);
        if (field.required && !control.value.trim()) {
          showSection_(0);
          markInvalid_(control, 'Complete “' + field.label + '”.');
          return false;
        }
      }

      var selected = getSelectedComponents_();
      if (!selected.length || selected.some(function(item) { return !item.code; })) {
        showSection_(1);
        var missingComponent = selected.find(function(item) { return !item.code; });
        var emptySelect = missingComponent
          ? missingComponent.row.querySelector('.component-code')
          : document.querySelector('.component-code');
        markInvalid_(emptySelect, 'Seleccione el código de todos los componentes.');
        return false;
      }
      if (new Set(selected.map(function(item) { return item.code; })).size !== selected.length) {
        showSection_(1);
        showToast_('No puede seleccionar el mismo componente más de una vez.', 'error');
        return false;
      }
      for (var bIndex = 0; bIndex < selected.length; bIndex += 1) {
        if (!Number.isFinite(selected[bIndex].percentage) || selected[bIndex].percentage <= 0) {
          showSection_(1);
          markInvalid_(selected[bIndex].row.querySelector('.component-percentage'), 'Ingrese un porcentaje mayor que 0.');
          return false;
        }
      }
      var total = selected.reduce(function(sum, item) { return sum + item.percentage; }, 0);
      if (Math.abs(total - 100) > 0.01) {
        showSection_(1);
        showToast_('La suma de los componentes debe ser 100%.', 'error');
        return false;
      }

      for (var dIndex = 0; dIndex < state.schema.sectionD.fields.length; dIndex += 1) {
        var dField = state.schema.sectionD.fields[dIndex];
        var row = document.querySelector('#section-d-fields tr[data-field-id="' + dField.id + '"]');
        var inputs = ['min', 'target', 'max'].map(function(kind) {
          return row.querySelector('[data-kind="' + kind + '"]');
        });
        if (inputs.some(function(input) { return input.value.trim() === '' || !Number.isFinite(Number(input.value)); })) {
          showSection_(3);
          var missing = inputs.find(function(input) { return input.value.trim() === '' || !Number.isFinite(Number(input.value)); });
          markInvalid_(missing, 'Complete Min, Target y Max para “' + dField.label + '”.');
          return false;
        }
        var values = inputs.map(function(input) { return Number(input.value); });
        if (!(values[0] <= values[1] && values[1] <= values[2])) {
          showSection_(3);
          inputs.forEach(function(input) { input.classList.add('input-error'); });
          showToast_('En “' + dField.label + '” debe cumplirse Min ≤ Target ≤ Max.', 'error');
          inputs[0].focus();
          return false;
        }
      }
      return true;
    }

    function submitForm_(event) {
      event.preventDefault();
      if (!validateClient_()) return;

      var payload = collectPayload_();
      setBusy_(true, 'Creando carpetas y generando la hoja de cálculo…');
      callServer_('submitCase', payload)
        .then(showSuccess_)
        .catch(function(error) {
          showToast_(getErrorMessage_(error), 'error', 9000);
        })
        .finally(function() {
          setBusy_(false);
        });
    }

    function openSettings_() {
      populateSettings_();
      setSettingsFeedback_('', '');
      document.getElementById('settings-modal').classList.remove('hidden');
      setTimeout(function() { document.getElementById('destination-folder').focus(); }, 50);
    }

    function closeSettings_() {
      document.getElementById('settings-modal').classList.add('hidden');
    }

    function populateSettings_() {
      document.getElementById('destination-folder').value = state.settings.destinationFolderId || '';
      document.getElementById('template-spreadsheet').value = state.settings.templateSpreadsheetId || '';
    }

    function saveSettings_() {
      var destination = document.getElementById('destination-folder').value.trim();
      var template = document.getElementById('template-spreadsheet').value.trim();
      if (!destination || !template) {
        setSettingsFeedback_('Complete ambos campos.', 'error');
        return;
      }

      var button = document.getElementById('save-settings-button');
      button.disabled = true;
      button.textContent = 'Validando…';
      setSettingsFeedback_('', '');

      callServer_('saveUserSettings', {
        destinationFolderId: destination,
        templateSpreadsheetId: template
      })
        .then(function(result) {
          state.settings = {
            destinationFolderId: result.destinationFolderId,
            templateSpreadsheetId: result.templateSpreadsheetId
          };
          state.settingsComplete = true;
          updateSettingsWarning_();
          setSettingsFeedback_(
            'Configuración guardada: “' + result.destinationFolderName + '” y “' + result.templateSpreadsheetName + '”.',
            'success'
          );
          setTimeout(function() {
            document.getElementById('settings-modal').classList.add('hidden');
          }, 850);
        })
        .catch(function(error) {
          setSettingsFeedback_(getErrorMessage_(error), 'error');
        })
        .finally(function() {
          button.disabled = false;
          button.textContent = 'Validar y guardar';
        });
    }

    function updateSettingsWarning_() {
      document.getElementById('settings-warning').classList.toggle('hidden', state.settingsComplete);
    }

    function setSettingsFeedback_(message, type) {
      var feedback = document.getElementById('settings-feedback');
      feedback.textContent = message;
      feedback.className = 'inline-feedback' + (type ? ' ' + type : ' hidden');
    }

    function showSuccess_(result) {
      document.getElementById('success-message').textContent =
        'Se creó “' + result.caseName + '” con sus cuatro carpetas y la hoja “' + result.spreadsheetName + '” dentro de 01.';
      document.getElementById('open-spreadsheet-link').href = result.spreadsheetUrl;
      document.getElementById('open-folder-link').href = result.caseFolderUrl;
      document.getElementById('success-modal').classList.remove('hidden');
    }

    function resetForAnotherCase_() {
      document.getElementById('success-modal').classList.add('hidden');
      document.getElementById('case-form').reset();
      document.getElementById('component-rows').replaceChildren();
      addComponentRow_('');
      clearAllErrors_();
      updatePercentageTotal_();
      renderSectionC_();
      showSection_(0);
      document.getElementById('case-name').focus();
    }

    function markInvalid_(control, message) {
      if (control) {
        control.classList.add('input-error');
        control.focus();
      }
      showToast_(message, 'error');
    }

    function clearInputError_(control) {
      if (control) control.classList.remove('input-error');
    }

    function clearAllErrors_() {
      document.querySelectorAll('.input-error').forEach(function(control) {
        control.classList.remove('input-error');
      });
    }

    function setBusy_(busy, message) {
      document.getElementById('busy-message').textContent = message || 'Procesando…';
      document.getElementById('busy-overlay').classList.toggle('hidden', !busy);
    }

    function showToast_(message, type, duration) {
      var toast = document.getElementById('toast');
      window.clearTimeout(state.toastTimer);
      toast.textContent = message;
      toast.className = 'toast' + (type ? ' ' + type : '');
      state.toastTimer = window.setTimeout(function() {
        toast.classList.add('hidden');
      }, duration || 4500);
    }

    function callServer_(methodName) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function(resolve, reject) {
        var runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject);
        runner[methodName].apply(runner, args);
      });
    }

    function getErrorMessage_(error) {
      if (!error) return 'Ocurrió un error inesperado.';
      return error.message || String(error);
    }

    function createElement_(tagName, className, text) {
      var element = document.createElement(tagName);
      if (className) element.className = className;
      if (text != null) element.textContent = text;
      return element;
    }
  })();
</script>
